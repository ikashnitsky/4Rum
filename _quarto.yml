project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "newsletter.md"

website:
  title: "4R/um"
  description: "A monthly R exchange meeting at Statistics Denmark"
  favicon: logo/hex-logo.png
  navbar:
    logo: logo/hex-logo.png
    title: "4R/um"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Meetings"
        href: index.qmd#meetings
      - text: "Newsletter"
        href: newsletter.md
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/ikashnitsky/4Rum
        aria-label: GitHub Repository
  page-footer:
    left: "4R/um &bull; Organized by Data Science Lab at [Statistics Denmark (dst.dk)](https://www.dst.dk)"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: sketchy
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
