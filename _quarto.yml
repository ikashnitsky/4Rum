project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "newsletter.md"
    - "about.qmd"
  resources:
    - CNAME
    - "slides/**"

website:
  title: "4R/um"
  description: "4R/um is a monthly R exchange meeting at Statistics Denmark: talks, slides, and a monthly newsletter on R, Quarto, and open-source data science."
  site-url: https://dshub.dev
  repo-url: https://github.com/ikashnitsky/4Rum
  image: img/4rum-banner.png
  favicon: img/dshub-logo-clean.svg
  open-graph:
    locale: en_US
    site-name: "4R/um"
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: img/4rum-logo-512.png
    logo-alt: "4R/um logo"
    title: "4R/um"
    left:
      - text: "Meetings"
        href: index.qmd#meetings
      - text: "Newsletter"
        href: newsletter.md
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/ikashnitsky/4Rum
        aria-label: GitHub Repository
  page-footer:
    left: "4R/um &bull; [Ilya Kashnitsky](https://ikashnitsky.phd) @ [Data Science Lab](https://www.dst.dk/da/TilSalg/data-til-forskning/data-science-lab) // [Statistics Denmark](https://www.dst.dk)"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: sketchy
    css: styles.css
    lang: en
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <script src="https://cdn.counter.dev/script.js" data-id="daa70324-89c3-4b1c-8ea0-3588f29f41f5" data-utcoffset="1"></script>
